<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Interactivo de Radiología Forense</title>
    <style>
        /* Variables de color para simular un entorno clínico */
        :root {
            --bg-color: #f0f4f8;
            --text-color: #2d3748;
            --card-bg: #ffffff;
            --primary: #2b6cb0;
            --accent: #e53e3e;
            --shadow: rgba(0, 0, 0, 0.1) 0px 10px 15px -3px;
        }

        /* Modo Negatoscopio (Oscuro) */
        [data-theme="dark"] {
            --bg-color: #1a202c;
            --text-color: #e2e8f0;
            --card-bg: #2d3748;
            --primary: #63b3ed;
            --shadow: rgba(0, 0, 0, 0.5) 0px 10px 15px -3px;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; transition: background-color 0.4s ease; }
        
        header { background: linear-gradient(135deg, var(--primary), #1a365d); color: white; padding: 40px 20px; text-align: center; box-shadow: var(--shadow); position: relative;}
        header h1 { margin: 0; font-size: 2.5em; letter-spacing: 1px; }
        header p { margin-top: 10px; font-size: 1.2em; opacity: 0.9; }

        /* Controles (Botones y Filtros) */
        .controles { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; background: var(--card-bg); border-bottom: 2px solid var(--primary); transition: 0.4s;}
        button { cursor: pointer; padding: 10px 20px; border: none; border-radius: 25px; font-weight: bold; transition: all 0.3s ease; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--primary); }
        button:hover, button.activo { background: var(--primary); color: white; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        
        .btn-negatoscopio { position: absolute; top: 20px; right: 20px; background: #ecc94b; color: #1a202c; border: none; }
        .btn-negatoscopio:hover { background: #d69e2e; }

        /* Cuadrícula de Casos */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; padding: 40px; max-width: 1400px; margin: 0 auto; }
        
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column;}
        .card:hover { transform: translateY(-10px); box-shadow: rgba(0, 0, 0, 0.2) 0px 20px 25px -5px; }
        
        .img-container { overflow: hidden; position: relative; }
        .card img { width: 100%; height: 280px; object-fit: cover; transition: transform 0.5s ease; cursor: crosshair; }
        .card img:hover { transform: scale(1.1); } /* Efecto Lupa al pasar el ratón */
        
        .card-content { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .tag { background: var(--primary); color: white; padding: 5px 12px; border-radius: 15px; font-size: 0.85em; font-weight: bold; align-self: flex-start; text-transform: uppercase; letter-spacing: 0.5px;}
        .card h3 { margin: 15px 0 10px; font-size: 1.4em; }
        
        /* Mini-juego: Reto Pericial */
        .seccion-dictamen { background: rgba(0,0,0,0.05); padding: 15px; border-radius: 8px; margin-top: auto; border-left: 4px solid var(--accent); }
        .hallazgo-oculto { filter: blur(6px); cursor: pointer; user-select: none; transition: filter 0.4s ease; margin-top: 10px; font-style: italic;}
        .hallazgo-oculto.revelado { filter: blur(0); cursor: text; user-select: text; font-style: normal;}
        .btn-revelar { background: var(--accent); color: white; border: none; width: 100%; margin-top: 10px; border-radius: 5px; }
        .btn-revelar:hover { background: #c53030; }

        /* Mensaje si no hay resultados */
        .sin-resultados { text-align: center; grid-column: 1 / -1; font-size: 1.5em; opacity: 0.6; padding: 40px; }
    </style>
</head>
<body>

    <header>
        <button id="btn-tema" class="btn-negatoscopio">💡 Encender Negatoscopio</button>
        <h1>Atlas Interactivo de Radiología Forense</h1>
        <p>Universidad Central del Ecuador | 7mo Semestre</p>
    </header>

    <div class="controles" id="filtros">
        <button class="filtro activo" data-cat="Todos">Todos los Expedientes</button>
        <button class="filtro" data-cat="Arma de Fuego">Armas de Fuego</button>
        <button class="filtro" data-cat="Asfixia Mecánica">Asfixias</button>
        <button class="filtro" data-cat="Suceso de Tránsito">Tránsito</button>
        <button class="filtro" data-cat="Arma Blanca">Armas Blancas</button>
        <button class="filtro" data-cat="Contusiones">Contusiones</button>
    </div>

    <div class="grid-container" id="atlas-container">
        <!-- JS inyectará los casos aquí -->
    </div>

    <script src="app.js"></script>
</body>
</html>
