<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Atlas de Radiología Forense</title>
	<style>
		body { font-family: system-ui, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
		header { text-align: center; margin-bottom: 30px; }
		.grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
		.card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
		.card img { width: 100%; height: 250px; object-fit: cover; border-bottom: 2px solid #eee; }
		.card-content { padding: 15px; }
		.tag { background: #0056b3; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; display: inline-block; margin-bottom: 10px; }
	</style>
</head>
<body>

	<header>
		<h1>Atlas Digital de Radiología Forense</h1>
		<p>Universidad Central del Ecuador - Séptimo Semestre</p>
	</header>

	<div class="grid-container" id="atlas-container">
		<!-- Las tarjetas de los casos se inyectarán aquí vía JavaScript -->
	</div>

	<script src="app.js"></script>
</body>
</html>
